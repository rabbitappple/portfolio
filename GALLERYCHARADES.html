           .container {
        position: relative;
        min-height: 100vh;

      .container .image-container {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: center;
        padding: 10px;
      }

      .container .image-container .image {
        height: 250px;
        width: 350px;
        border: 10px solid #e2ecab;
        box-shadow: 0 5px 15px black .5;
        overflow: hidden;
        cursor: pointer;
      }

      .container .image-container .image img {
        height: 100%;
        width: 100%;
        object-fit: cover;
        transition: 0.2s linear;
      }
      .container .image-container .image:hover img {
        transform: scale(1.1);
      }

      .container .popup-image {
        position: fixed;
        top: 0;
        left: 0;
        background: black;
        height: 100%;
        width: 100%;
        z-index: 100;
        display: none;
      }
      .container .popup-image span {
        position: absolute;
        top: 0;
        right: 10px;
        font-size: 40px;
        font-weight: bolder;
        color: #8c0b13;
        cursor: pointer;
        z-index: 100;
      }

      .container .popup-image img {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 5px solid white;
        border-radius: 5px;
        width: 80%;
        object-fit: cover;
      }

      @media (max-width: 768px) {
        .container .popup-image img {
          width: 95%;
        }
      }

body {
    font-family: Arial, sans-serif;

}

.titulo {
    text-align: center;

}

.galeria {
    display: grid;
   
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    max-width: 1200px;
    margin: 0 auto;
}

.foto {
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    background-color: #fff;
}

.foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
}

.foto:hover img {
    transform: scale(1.05);
}
.lightbox {
    display: none; 
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.9); 
    z-index: 1000;
    justify-content: center;
    align-items: center;
    cursor: zoom-out;
}

.lightbox img {
    max-width: 90%;
    max-height: 80%;
    border-radius: 4px;
    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
    animation: zoomIn 0.3s ease; 
}


.cerrar {
    position: absolute;
    top: 20px;
    right: 30px;
    color: #fff;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
}

@keyframes zoomIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }

}

.flecha {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.5);
    color: white;
    font-size: 30px;
    border: none;
    padding: 15px 20px;
    cursor: pointer;
    border-radius: 5px;
    transition: background 0.2s;
    user-select: none;
    z-index: 1010;
}

.flecha:hover {
    background: rgba(255, 255, 255, 0.2);
}

.izq { left: 20px; }
.der { right: 20px; }

.lightbox img, .flecha {
    pointer-events: auto;}

                  <script>

const imagenes = document.querySelectorAll('.galeria .foto img');
const lightbox = document.getElementById('lightbox');
const imagenLightbox = document.getElementById('imagen-lightbox');
const btnCerrar = document.getElementById('btn-cerrar');
const btnIzq = document.getElementById('btn-izq');
const btnDer = document.getElementById('btn-der');

let indiceActual = 0;

function mostrarImagen(indice) {
    imagenLightbox.src = imagenes[indice].src;
    indiceActual = indice;
}


imagenes.forEach((img, indice) => {
    img.addEventListener('click', () => {
        lightbox.style.display = 'flex';
        mostrarImagen(indice);
    });
});

function imagenAnterior() {
    let nuevoIndice = indiceActual - 1;
    if (nuevoIndice < 0) {
        nuevoIndice = imagenes.length - 1; 
    }
    mostrarImagen(nuevoIndice);
}

function imagenSiguiente() {
    let nuevoIndice = indiceActual + 1;
    if (nuevoIndice >= imagenes.length) {
        nuevoIndice = 0; 
    }
    mostrarImagen(nuevoIndice);
}

btnIzq.addEventListener('click', (e) => {
    e.stopPropagation(); 
    imagenAnterior();
});

btnDer.addEventListener('click', (e) => {
    e.stopPropagation();
    imagenSiguiente();
});


function cerrarLightbox() {
    lightbox.style.display = 'none';
}

btnCerrar.addEventListener('click', cerrarLightbox);


lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
        cerrarLightbox();
    }
});


document.addEventListener('keydown', (e) => {
    if (lightbox.style.display === 'flex') {
        if (e.key === 'ArrowRight') imagenSiguiente();
        if (e.key === 'ArrowLeft') imagenAnterior();
        if (e.key === 'Escape') cerrarLightbox();
    }
});
    </script>
